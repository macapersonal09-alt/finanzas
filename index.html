<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <title>Finanzas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="estilos.css?v=1">
</head>
<body>
  <div id="app">
    <header class="barra">
      <h1 id="titulo">Finanzas</h1>
      <button id="btnRecargar" class="icono" aria-label="Actualizar" hidden>↻</button>
    </header>
    <main id="vista"><p class="cargando">Cargando…</p></main>
    <nav id="nav" hidden>
      <button data-ir="inicio" class="activo"><span>◎</span>Inicio</button>
      <button data-ir="bandeja"><span>✓</span>Bandeja<b id="badge" hidden></b></button>
      <button data-ir="movimientos"><span>≡</span>Movimientos</button>
      <button data-ir="nuevo" class="mas"><span>+</span>Gasto</button>
    </nav>
  </div>
  <div id="hoja" hidden></div>
  <div id="aviso" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=1"></script>
  <script src="app.js?v=1"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
